<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Netcodes logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The label: a white card with one folded corner, like a peeled thermal label -->
  <path d="M104 96h224l80 80v240a16 16 0 0 1-16 16H104a16 16 0 0 1-16-16V112a16 16 0 0 1 16-16z" fill="#FFFFFF"/>
  <path d="M328 96v64a16 16 0 0 0 16 16h64z" fill="#C7D2FE"/>
  <!-- The "N": two bars joined by a diagonal, so the letter is also a barcode -->
  <rect x="136" y="164" width="40" height="150" rx="6" fill="#0F172A"/>
  <rect x="276" y="164" width="40" height="150" rx="6" fill="#0F172A"/>
  <polygon points="136,164 176,164 316,314 276,314" fill="#4338CA"/>
  <!-- A row of barcode bars under the letter -->
  <g fill="#0F172A">
    <rect x="136" y="346" width="12" height="46"/><rect x="158" y="346" width="6" height="46"/>
    <rect x="174" y="346" width="18" height="46"/><rect x="202" y="346" width="6" height="46"/>
    <rect x="218" y="346" width="12" height="46"/><rect x="240" y="346" width="24" height="46"/>
    <rect x="274" y="346" width="6" height="46"/><rect x="290" y="346" width="18" height="46"/>
    <rect x="318" y="346" width="12" height="46"/><rect x="340" y="346" width="6" height="46"/>
  </g>
</svg>
